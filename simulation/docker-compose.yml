# Couchmo simulation stack
# UI is served via noVNC at http://localhost:6081/vnc.html — no X server needed.
# Usage: ./run.sh sim   (macOS/Linux)
#        .\run.ps1 sim  (Windows)

services:

  # ── Full sim: Gazebo + SLAM + Nav2 + RViz (Phase 3) ────
  sim:
    build:
      context: .
      dockerfile: Dockerfile.sim
    container_name: couchmo_sim
    environment:
      - ROS_DOMAIN_ID=42
    ports:
      - "6081:6080"   # browser: http://localhost:6081/vnc.html
    volumes:
      - ../training/data:/workspace/data
    stdin_open: true
    tty: true

  # ── URDF preview — browser-based via noVNC ──────────────
  preview:
    build:
      context: .
      dockerfile: Dockerfile.preview
    container_name: couchmo_preview
    environment:
      - ROS_DOMAIN_ID=42
    ports:
      - "6080:6080"
    stdin_open: true
    tty: true

  # ── Headless sim: no noVNC port, for batch dataset gen ──
  sim_headless:
    build:
      context: .
      dockerfile: Dockerfile.sim
    container_name: couchmo_sim_headless
    environment:
      - ROS_DOMAIN_ID=42
    volumes:
      - ../training/data:/workspace/data
    stdin_open: true
    tty: true

volumes:
  couchmo_sim_build:
  couchmo_sim_install:
